docker:
  name: Docker Build & Deploy
  runs-on: ubuntu-latest
  needs:
    - backend
    - frontend

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      run: |
        docker build -t linkpulse-backend:latest .
        docker tag linkpulse-backend:latest 685570573364.dkr.ecr.ap-south-1.amazonaws.com/linkpulse-backend:latest

    - name: Push Docker Image
      run: |
        docker push 685570573364.dkr.ecr.ap-south-1.amazonaws.com/linkpulse-backend:latest

    - name: Force ECS Deployment
      run: |
        aws ecs update-service \
          --cluster linkpulse-cluster \
          --service linkpulse-backend-service \
          --force-new-deployment

    - name: Wait for Deployment
      run: |
        aws ecs wait services-stable \
          --cluster linkpulse-cluster \
          --services linkpulse-backend-service